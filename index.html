<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Thale og Jacob gifter seg 5. juni 2027 på Hindsæter Hotell i Jotunheimen.">
<title>Thale &amp; Jacob – Bryllup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F1;
    --bg-dark: #24322B;
    --text-dark: #24322B;
    --text-light: #F5F6F1;
    --text-muted: #5B6A62;
    --accent: #B8945A;
    --accent-soft: #E3D6B8;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Work Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-dark);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    min-height: 92vh;
    background: var(--bg-dark);
    color: var(--text-light);
    overflow: hidden;
  }
  .hero-media {
    position: absolute;
    inset: 0;
  }
  .hero-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(36,50,43,.55) 0%, rgba(36,50,43,.75) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 1;
    min-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.5rem clamp(9rem, 24vh, 15rem);
  }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    margin: 0;
    letter-spacing: 0.01em;
  }
  .hero .amp { color: var(--accent); font-style: italic; }
  .hero-kicker {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.1rem, 2.8vw, 1.35rem);
    color: var(--accent-soft);
    margin: 0 0 1.4rem;
  }
  .hero-date {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 5.5vw, 2.6rem);
    color: var(--accent);
    margin: 1.2rem 0 0;
  }
  .hero-sub {
    margin: 1.6rem 0 0;
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    letter-spacing: 0.03em;
    color: var(--accent-soft);
  }
  .divider {
    width: 46px;
    height: 1px;
    background: var(--accent);
    margin: 2.4rem 0 0;
  }

  .photo {
    position: relative;
    margin: 0 auto;
    overflow: hidden;
    background: var(--accent-soft);
    border-radius: 2px;
  }
  .photo .ph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-venue { max-width: 780px; aspect-ratio: 16 / 9; margin-bottom: 3.5rem; }

  section.info {
    max-width: 780px;
    margin: 0 auto;
    padding: 4.5rem 1.5rem 4.5rem;
    text-align: center;
  }
  section.info h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    margin: 0 0 3rem;
  }
  .info-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
  }
  .info-item {
    flex: 1 1 160px;
    padding: 0 1.5rem;
    border-left: 1px solid var(--accent-soft);
  }
  .info-item:first-child { border-left: none; }
  .info-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .info-value {
    display: block;
    font-family: var(--serif);
    font-size: 1.3rem;
  }

  .info-note {
    display: block;
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-top: 0.3rem;
  }

  section.closing {
    background: var(--accent-soft);
    text-align: center;
    padding: 5rem 1.5rem;
  }
  section.closing h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    margin: 0 0 0.9rem;
  }
  section.closing p {
    margin: 0;
    color: var(--text-muted);
    font-size: 1rem;
  }
  footer {
    text-align: center;
    padding: 2.8rem 1.5rem calc(2.8rem + env(safe-area-inset-bottom, 0px));
  }
  footer .divider { margin: 0 auto 1.2rem; }
  footer p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  @media (max-width: 480px) {
    .info-item { border-left: none; padding: 0.9rem 0; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero-kicker, .hero h1, .hero-date, .hero .divider, .hero-sub {
      animation: rise 0.9s ease-out both;
    }
    .hero h1 { animation-delay: 0.1s; }
    .hero-date { animation-delay: 0.2s; }
    .hero .divider { animation-delay: 0.3s; }
    .hero-sub { animation-delay: 0.4s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="hero-media">
      <img src="images/thale-og-jacob.jpg" alt="" decoding="async" onerror="this.remove()">
    </div>
    <div class="hero-content">
      <p class="hero-kicker">Sett av datoen</p>
      <h1>Thale <span class="amp">&amp;</span> Jacob</h1>
      <p class="hero-date">5. juni 2027</p>
      <div class="divider"></div>
      <p class="hero-sub">Hindsæter Hotell · Jotunheimen</p>
    </div>
  </section>

  <section class="info">
    <figure class="photo photo-venue">
      <span class="ph">Bilde av Hindsæter Hotell<br>images/hindsaeter.jpg</span>
      <img src="images/hindsaeter.jpg" alt="Hindsæter Hotell i Jotunheimen" loading="lazy" decoding="async" onerror="this.remove()">
    </figure>
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Sted</span>
        <span class="info-value">Hindsæter Hotell</span>
        <span class="info-note">Jotunheimen</span>
      </div>
      <div class="info-item">
        <span class="info-label">Opphold</span>
        <span class="info-value">Fredag–søndag</span>
        <span class="info-note">4.–6. juni</span>
      </div>
    </div>
  </section>

  <section class="closing">
    <h2>Invitasjon følger</h2>
    <p>Mer informasjon kommer senere.</p>
  </section>

  <footer>
    <div class="divider"></div>
    <p>Thale &amp; Jacob · 2027</p>
  </footer>

</body>
</html>
